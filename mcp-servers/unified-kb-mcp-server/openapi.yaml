openapi: 3.0.3
info:
  title: Unified KB MCP Server
  description: >-
    Namespace-partitioned knowledge-base MCP server exposed over the MCP
    Streamable HTTP transport. All traffic flows through the single /mcp
    endpoint; the caller's namespace is resolved from the API key it presents.
  version: 1.0.0
servers:
  - url: /
paths:
  /mcp:
    post:
      operationId: mcpRequest
      summary: Send an MCP JSON-RPC request
      description: >-
        MCP Streamable HTTP endpoint. Accepts a JSON-RPC 2.0 message
        (initialize, tools/list, tools/call, ...) and replies with either a JSON
        response or an SSE stream, depending on the Accept header.
      parameters:
        - name: Mcp-Session-Id
          in: header
          required: false
          description: Session identifier returned by the initialize response.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonRpcRequest'
      responses:
        "200":
          description: JSON-RPC response, or an SSE stream of responses.
          content:
            application/json:
              schema:
                type: object
            text/event-stream:
              schema:
                type: string
        "400":
          description: Malformed JSON-RPC request.
        "401":
          description: Missing or unrecognized API key.
    get:
      operationId: mcpStream
      summary: Open the MCP server-to-client SSE stream
      parameters:
        - name: Mcp-Session-Id
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: SSE stream of server-initiated messages.
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          description: Missing or unrecognized API key.
    delete:
      operationId: mcpTerminate
      summary: Terminate the MCP session
      parameters:
        - name: Mcp-Session-Id
          in: header
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Session terminated.
        "404":
          description: Unknown session.
components:
  schemas:
    JsonRpcRequest:
      type: object
      required:
        - jsonrpc
        - method
      properties:
        jsonrpc:
          type: string
          example: "2.0"
        id:
          oneOf:
            - type: string
            - type: integer
        method:
          type: string
          example: tools/call
        params:
          type: object
