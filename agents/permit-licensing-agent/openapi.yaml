openapi: 3.1.0
info:
  title: Permit & Licensing Agent
  version: 0.1.0
  description: >
    Standard chat interface for the Permit & Licensing Agent — checks permit/license status,
    reads fee schedules, verifies applicant identity via the external State ID Verification
    service, and pre-fills new applications against the dedicated Permit DB MCP server. Both
    deployed instances (Building Permits, Business Licenses) expose this same contract.

servers:
  - url: http://localhost:8000
    description: Local development server

paths:
  /chat:
    post:
      summary: Chat with Agent
      description: Send a resident permit/licensing question or request.
      operationId: chat_chat_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
            examples:
              fee_estimate_query:
                summary: Building Permits instance — ADU fee estimate
                value:
                  message: "What would it cost to build a 650 sqft ADU worth about $90,000?"
                  session_id: "session_abc123"
              status_query:
                summary: Business Licenses instance — application status
                value:
                  message: "What is the status of business license BL-2026-00012?"
                  session_id: "session_abc124"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
              examples:
                fee_estimate_response:
                  summary: Grounded fee estimate with citation
                  value:
                    response: >-
                      For an ADU permit with a project valuation of $90,000, the estimated
                      total fee is $815 (base $275 + plan check $180 + $4.00/$1,000 of
                      valuation), per the ADU Permit fee schedule. This is an estimate —
                      final figures are confirmed at plan check.
                    session_id: "session_abc123"
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: "An unexpected error occurred"
    get:
      summary: Health check
      description: Basic liveness check reporting which county/permit focus this instance serves.
      operationId: health_health_get
      responses:
        '200':
          description: Instance is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

components:
  schemas:
    ChatRequest:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          title: Message
          description: Resident permit/licensing question or request
          example: "What would it cost to build a 650 sqft ADU worth about $90,000?"
          minLength: 1
        session_id:
          type: string
          title: SessionId
          description: Optional session/conversation identifier, echoed back unchanged
          example: "session_abc123"
        context:
          type: object
          title: Context
          description: Optional JSON context object passed through with the message
          additionalProperties: true
      title: ChatRequest

    ChatResponse:
      type: object
      required:
        - response
      properties:
        response:
          type: string
          title: Response
          description: Agent answer, grounded in the Permit DB and State ID Verification tools
        session_id:
          type: string
          title: SessionId
          description: Echoes the session_id from the request, if one was provided
      title: ChatResponse

    HealthResponse:
      type: object
      required:
        - status
        - county
        - focus
      properties:
        status:
          type: string
          example: "ok"
        county:
          type: string
          example: "Riverside County"
        focus:
          type: string
          description: Which permit types the prompt for this instance emphasizes (branding only)
          example: "Building Permits"
      title: HealthResponse

    HTTPValidationError:
      type: object
      properties:
        detail:
          type: array
          items:
            $ref: "#/components/schemas/ValidationError"
          title: Detail
      title: HTTPValidationError

    ValidationError:
      type: object
      required:
        - loc
        - msg
        - type
      properties:
        loc:
          type: array
          items:
            anyOf:
              - type: string
              - type: integer
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      title: ValidationError
