<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky-sec" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A5B8C"/>
      <stop offset="100%" stop-color="#12283f"/>
    </linearGradient>
    <linearGradient id="facade-sec" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3e9dd"/>
      <stop offset="100%" stop-color="#d9c9b3"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="500" fill="url(#sky-sec)"/>
  <circle cx="1000" cy="90" r="46" fill="#FFC72C" opacity="0.85"/>
  <rect x="0" y="420" width="1200" height="80" fill="#0b1a29" opacity="0.5"/>
  <!-- central tower -->
  <rect x="520" y="140" width="160" height="290" fill="url(#facade-sec)"/>
  <polygon points="500,140 600,60 700,140" fill="#e8d8c4"/>
  <rect x="590" y="30" width="20" height="34" fill="#e8d8c4"/>
  <!-- wings -->
  <rect x="260" y="230" width="250" height="200" fill="url(#facade-sec)" opacity="0.92"/>
  <rect x="690" y="230" width="250" height="200" fill="url(#facade-sec)" opacity="0.92"/>
  <!-- columns on wings -->
  <g fill="#fdf6ec" opacity="0.9">
    <rect x="280" y="250" width="14" height="180"/>
    <rect x="320" y="250" width="14" height="180"/>
    <rect x="360" y="250" width="14" height="180"/>
    <rect x="400" y="250" width="14" height="180"/>
    <rect x="440" y="250" width="14" height="180"/>
    <rect x="480" y="250" width="14" height="180"/>
    <rect x="710" y="250" width="14" height="180"/>
    <rect x="750" y="250" width="14" height="180"/>
    <rect x="790" y="250" width="14" height="180"/>
    <rect x="830" y="250" width="14" height="180"/>
    <rect x="870" y="250" width="14" height="180"/>
    <rect x="910" y="250" width="14" height="180"/>
  </g>
  <!-- columns on central tower -->
  <g fill="#fdf6ec" opacity="0.95">
    <rect x="540" y="160" width="16" height="270"/>
    <rect x="580" y="160" width="16" height="270"/>
    <rect x="620" y="160" width="16" height="270"/>
    <rect x="660" y="160" width="16" height="270"/>
  </g>
  <rect x="0" y="430" width="1200" height="70" fill="#0b1a29" opacity="0.6"/>
  <text x="600" y="470" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#ffe9ce" opacity="0.55">Illustrative artwork — Riverside County Administration Building (stylized, demo)</text>
</svg>
