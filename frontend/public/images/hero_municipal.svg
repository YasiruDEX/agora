    <rect x="670" y="240" width="18" height="160"/>
    <rect x="720" y="240" width="18" height="160"/>
    <rect x="770" y="240" width="18" height="160"/>
    <rect x="820" y="240" width="18" height="160"/>
    <rect x="870" y="240" width="18" height="160"/>
