<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky-parl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f3d33"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="500" fill="url(#sky-parl)"/>
  <circle cx="180" cy="80" r="40" fill="#FFC72C" opacity="0.8"/>
  <rect x="0" y="380" width="1200" height="30" fill="#053a2b"/>
  <rect x="0" y="410" width="1200" height="90" fill="#03291e"/>
  <!-- water reflection strip (Parliament sits on Diyawanna Oya) -->
  <rect x="0" y="410" width="1200" height="90" fill="#0a4a38" opacity="0.5"/>
  <!-- roof pavilion modules, evoking a pyramidal-roofed legislative complex -->
  <g fill="#eef1e9">
    <polygon points="140,300 260,220 380,300" opacity="0.95"/>
    <rect x="150" y="300" width="220" height="80"/>
    <polygon points="420,270 600,170 780,270" opacity="0.98"/>
    <rect x="430" y="270" width="340" height="110"/>
    <polygon points="820,300 940,220 1060,300" opacity="0.95"/>
    <rect x="830" y="300" width="220" height="80"/>
  </g>
  <g fill="#cdd6c2" opacity="0.7">
    <rect x="160" y="310" width="10" height="70"/>
    <rect x="200" y="310" width="10" height="70"/>
    <rect x="240" y="310" width="10" height="70"/>
    <rect x="280" y="310" width="10" height="70"/>
    <rect x="320" y="310" width="10" height="70"/>
    <rect x="450" y="280" width="12" height="100"/>
    <rect x="500" y="280" width="12" height="100"/>
    <rect x="550" y="280" width="12" height="100"/>
    <rect x="600" y="280" width="12" height="100"/>
    <rect x="650" y="280" width="12" height="100"/>
    <rect x="700" y="280" width="12" height="100"/>
    <rect x="750" y="280" width="12" height="100"/>
    <rect x="850" y="310" width="10" height="70"/>
    <rect x="890" y="310" width="10" height="70"/>
    <rect x="930" y="310" width="10" height="70"/>
    <rect x="970" y="310" width="10" height="70"/>
    <rect x="1010" y="310" width="10" height="70"/>
  </g>
  <line x1="600" y1="170" x2="600" y2="130" stroke="#eef1e9" stroke-width="3"/>
  <text x="600" y="470" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#dff0e6" opacity="0.6">Illustrative artwork — Parliament complex (stylized, demo)</text>
</svg>
